version: 2

# Lưu ý cú pháp dbt 1.12: tham số của generic test phải nằm dưới
# `arguments:`. Cách viết cũ (tham số đặt thẳng) đã deprecated.

models:
  - name: stg_ecommerce__customers
    description: >
      Khách hàng đã làm sạch: email lowercase/trim, city rỗng -> NULL.
      Hạt: một dòng một khách hàng.
    columns:
      - name: customer_id
        description: Khoá chính.
        data_tests: [unique, not_null]
      - name: email
        description: Email đã chuẩn hoá về chữ thường, không khoảng trắng.
        data_tests:
          - not_null
          # Sau khi chuẩn hoá thì email phải là duy nhất
          - unique
      - name: country
        data_tests:
          - accepted_values:
              arguments:
                values: ['VN', 'SG', 'TH', 'MY', 'ID', 'PH']
      - name: is_active
        data_tests: [not_null]

  - name: stg_ecommerce__products
    description: >
      Sản phẩm đã làm sạch, kèm biên lợi nhuận đơn vị tính sẵn.
      Hạt: một dòng một sản phẩm.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: unit_price
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: gross_margin_pct
        description: Biên lợi nhuận gộp theo %, làm tròn 2 chữ số.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -100
                max_value: 100

  - name: stg_ecommerce__orders
    description: >
      Header đơn hàng đã lọc theo var start_date, kèm cột lịch và cờ
      is_revenue_order. Hạt: một dòng một đơn hàng.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__customers')
                field: customer_id
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pending', 'shipped', 'completed', 'cancelled', 'returned']
      - name: is_revenue_order
        description: TRUE nếu đơn được tính vào doanh thu (không huỷ/trả).
        data_tests: [not_null]

  - name: stg_ecommerce__order_items
    description: >
      Dòng hàng đã tính gross/discount/net amount.
      Hạt: một dòng một order_item.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_ecommerce__products')
                field: product_id
      - name: quantity
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 100
      - name: net_amount
        description: Thành tiền sau chiết khấu.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
