# =====================================================================
# profiles.yml — cấu hình kết nối dbt -> BigQuery
#
# File này KHÔNG chứa secret: mọi giá trị đọc từ biến môi trường (.env).
# Vì vậy có thể commit an toàn lên git.
#
# dbt tìm file này qua biến DBT_PROFILES_DIR (đã set trong .env và
# .vscode/settings.json thành "." = thư mục repo).
# =====================================================================

ecommerce_analytics:
  target: dev

  outputs:
    # ---------------- DEV: chạy local bằng tài khoản cá nhân ----------
    dev:
      type: bigquery
      # oauth = dùng Application Default Credentials từ
      #   gcloud auth application-default login
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_DBT_DATASET', 'dbt_dev') }}"
      location: "{{ env_var('BQ_LOCATION', 'asia-southeast1') }}"
      threads: "{{ env_var('DBT_THREADS', '4') | int }}"

      # Huỷ query nếu chạy quá 5 phút -> tránh đốt tiền do query lỗi
      job_execution_timeout_seconds: 300
      job_retries: 1
      priority: interactive

      # Chặn query quét quá 20 GB. Bỏ comment khi muốn siết chi phí.
      # maximum_bytes_billed: 21474836480

    # ---------------- PROD: dung cho Airflow chay theo lich ----------
    # Kich hoat bang: dbt run --target prod
    #
    # KHONG dung service account key. Project nay bat org policy
    # constraints/iam.disableServiceAccountKeyCreation nen tai key ve se loi
    # FAILED_PRECONDITION. Thay vao do dung IMPERSONATION: xac thuc bang ADC
    # cua nguoi/may dang chay, roi muon danh tinh service account.
    #
    # Doi lai la ADC phai ton tai va con han. Neu sau nay policy cho phep key
    # thi doi lai thanh method: service-account + keyfile: env_var('GCP_SA_KEYFILE').
    #
    # Yeu cau: tai khoan trong ADC phai co roles/iam.serviceAccountTokenCreator
    # TREN chinh service account do, va API iamcredentials.googleapis.com da bat.
    #
    # De trong mac dinh la co y: dbt render CA file profiles.yml nen target dev
    # cung phai parse duoc dong nay khi bien chua duoc set. Chuoi rong = khong
    # muon danh tinh ai ca.
    prod:
      type: bigquery
      method: oauth
      impersonate_service_account: "{{ env_var('GCP_IMPERSONATE_SA', '') }}"
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_PROD_DATASET', 'analytics') }}"
      location: "{{ env_var('BQ_LOCATION', 'asia-southeast1') }}"
      threads: 8
      job_execution_timeout_seconds: 600
      job_retries: 2
      priority: interactive

    # ---------------- CI: build tu Pull Request, dataset co lap -------
    # Dung boi DAG git_pr_builds trong Airflow: dbt build --target ci
    #
    # Cung service account key voi prod, chi khac TEN TARGET va dataset.
    # Chinh cai ten do la thu bao ve production: macro generate_schema_name
    # chi tra ve ten schema tho khi target.name == 'prod'. Voi target 'ci' no
    # roi vao nhanh else va them tien to dataset, nen PR #42 (BQ_CI_DATASET
    # = pr_42) ghi vao pr_42_staging / pr_42_intermediate / pr_42_marts.
    #
    # Neu build PR bang --target prod thi moi PR se de thang len bang
    # production, 15 phut mot lan.
    ci:
      type: bigquery
      method: oauth
      impersonate_service_account: "{{ env_var('GCP_IMPERSONATE_SA', '') }}"
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_CI_DATASET', 'ci_pr') }}"
      location: "{{ env_var('BQ_LOCATION', 'asia-southeast1') }}"
      threads: 8
      job_execution_timeout_seconds: 600
      job_retries: 2
      priority: interactive
